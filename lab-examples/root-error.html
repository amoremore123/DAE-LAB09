<!doctype html><html lang="es"><head><meta charset="UTF-8"><title>Error real de dos nodos raíz</title><style>body{font:18px Arial;margin:50px;background:#f7f6f2}pre{white-space:pre-wrap;background:#fff3ef;padding:24px;line-height:1.5}</style></head><body><h1>Dos nodos raíz sin Fragment</h1><p>Respuesta real del transformador de Vite al solicitar TwoRoots.jsx.</p><pre id="error">Cargando diagnóstico…</pre><script type="module">const response = await fetch('/lab-examples/TwoRoots.jsx'); const raw = await response.text(); let message=raw; try { const match=raw.match(/const error = ([^\n]+)/); if(match) message=JSON.parse(match[1]).message; } catch {} document.getElementById('error').textContent = 'HTTP '+response.status+'\n'+message.replace(/\u001b\[[0-9;]*m/g,'').slice(0,4500);</script></body></html>
